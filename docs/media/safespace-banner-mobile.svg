<svg xmlns="http://www.w3.org/2000/svg" width="768" height="800" viewBox="0 0 768 800" role="img" aria-labelledby="title description">
  <title id="title">SafeSpace</title>
  <desc id="description">Responsive original project banner. Camera, Bluetooth, network inventory and checklist in the existing midnight, violet and cyan identity. Decorative artwork.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#111727"/><stop offset="1" stop-color="#080b16"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#9b82ff"/><stop offset="1" stop-color="#48d9e9"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#9b82ff" stop-opacity=".15"/><stop offset="1" stop-color="#9b82ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="1" y="1" width="766" height="798" rx="20" fill="url(#surface)" stroke="#30394f"/>
  <ellipse cx="384" cy="490" rx="330" ry="230" fill="url(#light)"/>
  <path d="M48 54H82" stroke="#48d9e9" stroke-width="3"/>
  <text x="98" y="60" font-family="ui-monospace, 'Courier New', monospace" font-size="18" letter-spacing="2" fill="#48d9e9">PERSONAL PRIVACY TOOLKIT</text>
  <text x="43" y="186" font-family="Arial, Helvetica, sans-serif" font-size="102" font-weight="700" letter-spacing="-5" fill="#f4f5ff">SafeSpace</text>
  <text x="48" y="252" font-family="Arial, Helvetica, sans-serif" font-size="34" letter-spacing="-.4" fill="#bcc5dc">Inspect your space.</text>
  <text x="48" y="296" font-family="Arial, Helvetica, sans-serif" font-size="34" letter-spacing="-.4" fill="#bcc5dc">Understand what you observe.</text>
  <g fill="none" stroke="#6d7396" stroke-width="1">
    <circle cx="384" cy="495" r="140" stroke-opacity=".5"/><circle cx="384" cy="495" r="94" stroke-opacity=".45"/>
    <path d="M244 495H290M478 495H524M384 355V401M384 589V635" stroke-opacity=".6"/>
  </g>
