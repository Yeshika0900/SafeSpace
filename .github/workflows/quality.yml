name: Quality
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
            network-agent/package-lock.json
      - run: npm ci && npm --prefix website ci && npm --prefix network-agent ci
      - run: npm run format:check && npm run lint && npm run typecheck
      - run: npm test
      - run: npm run build && npm run bundle:check
      - run: npm audit --audit-level=moderate && npm --prefix website audit --audit-level=moderate && npm --prefix network-agent audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
        working-directory: website
      - run: npm run test:browser
        working-directory: website
      - name: Scan Git history for secrets
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz --output /tmp/gitleaks.tar.gz
          echo '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
